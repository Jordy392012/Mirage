name: Deploy MIRAGE Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js for regression tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MIRAGE regression tests
        run: node tests/analyzer-smoke-test.cjs
      - name: Run benchmark parser regression tests
        run: node tests/benchmark-results-test.cjs
      - name: Run optimization engine regression tests
        run: node tests/optimization-engine-test.cjs
      - name: Run compiler worker contract tests
        run: node tests/compiler-worker-contract-test.cjs
      - name: Fetch and verify pinned Clang WebAssembly assets
        run: |
          set -euo pipefail
          mkdir -p clang/bin
          base="https://seorii.page/wasm-idle/clang"
          curl --fail --location --retry 3 "$base/runtime-manifest.v1.json" -o clang/runtime-manifest.v1.json
          curl --fail --location --retry 3 "$base/bin/memfs.wasm.gz" -o clang/bin/memfs.wasm.gz
          curl --fail --location --retry 3 "$base/bin/clang.wasm.gz" -o clang/bin/clang.wasm.gz
          curl --fail --location --retry 3 "$base/bin/lld.wasm.gz" -o clang/bin/lld.wasm.gz
          curl --fail --location --retry 3 "$base/bin/sysroot.tar.gz" -o clang/bin/sysroot.tar.gz
          curl --fail --location --retry 3 "$base/libc-printscan-long-double.a.gz" -o clang/libc-printscan-long-double.a.gz
          echo "0b854bc6b41924420cfcc840509ecbe03af3c63ca3edd4940897917e32c8d8ad  clang/runtime-manifest.v1.json" | sha256sum --check
          echo "a3e43451bc15ae69a7f113009e2ee82ab4db711625c1782cd45d0d3c4d38175a  clang/bin/memfs.wasm.gz" | sha256sum --check
          echo "cc7b6b229af392f439a1ca89dbb8d5e016792264a0a6ee59608ff24e269be982  clang/bin/clang.wasm.gz" | sha256sum --check
          echo "798ce825f3e3cf9a695b6a049f157ba28d38731a3dc5e699ccdf23d69d3a5c20  clang/bin/lld.wasm.gz" | sha256sum --check
          echo "6188b500fa7af2dceadcbd6dcf2619b6935fa94c224c1c2078426666ebea1d50  clang/bin/sysroot.tar.gz" | sha256sum --check
          echo "b3f11e17e40fb13371a97244fdde00d5bd951ad8e20dfdf88a069167d6be628b  clang/libc-printscan-long-double.a.gz" | sha256sum --check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
